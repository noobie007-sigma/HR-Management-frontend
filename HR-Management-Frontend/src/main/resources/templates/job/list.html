<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobs – HR Management</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/employees.css}" />
    <style>
        /* ── Job-list page extras ─────────────────────────────────── */
        body { background: #f6f7fb; }

        .page-wrap {
            width: min(1100px, 100%);
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* top bar */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .top-bar h1 {
            font-size: 20px;
            font-weight: 700;
            color: #101828;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* search */
        .search-form {
            display: flex;
            gap: 8px;
            flex: 1;
            max-width: 400px;
        }

        .search-form input[type="text"] {
            flex: 1;
            min-height: 38px;
            padding: 8px 12px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 14px;
            color: #101828;
        }

        .search-form input[type="text"]:focus {
            outline: 2px solid #bfdbfe;
            border-color: #2563eb;
        }

        .btn-search {
            min-height: 38px;
            padding: 8px 16px;
            background: #2563eb;
            color: #fff;
            border: 0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-search:hover { background: #1d4ed8; }

        .btn-clear {
            min-height: 38px;
            padding: 8px 12px;
            background: #fff;
            color: #344054;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-clear:hover { background: #f9fafb; }

        /* table card */
        .table-card {
            background: #fff;
            border: 1px solid #eaecf0;
            border-radius: 10px;
            box-shadow: 0 1px 3px rgba(16,24,40,.06);
            overflow: hidden;
        }

        .table-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid #eaecf0;
        }

        .table-card-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: #101828;
        }

        .result-count {
            font-size: 13px;
            color: #667085;
        }

        /* data table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 12px 20px;
            border-bottom: 1px solid #eaecf0;
            text-align: left;
            font-size: 13px;
            vertical-align: middle;
        }

        .data-table th {
            color: #475467;
            background: #f9fafb;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .05em;
        }

        .data-table tr:last-child td { border-bottom: 0; }

        .data-table tbody tr:hover { background: #f9fafb; cursor: pointer; }

        .job-id-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 8px;
            background: #eff8ff;
            color: #175cd3;
            border: 1px solid #b2ddff;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            font-family: monospace;
            letter-spacing: .03em;
        }

        .salary-range {
            color: #344054;
            font-weight: 600;
            font-size: 13px;
        }

        .view-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #2563eb;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
        }

        .view-link:hover { text-decoration: underline; }

        /* pagination */
        .pagination-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 20px;
            border-top: 1px solid #eaecf0;
            flex-wrap: wrap;
        }

        .page-info {
            font-size: 13px;
            color: #667085;
        }

        .page-controls {
            display: flex;
            gap: 6px;
        }

        .page-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            min-height: 36px;
            padding: 6px 10px;
            border: 1px solid #d0d5dd;
            border-radius: 6px;
            background: #fff;
            color: #344054;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .page-btn:hover { background: #f9fafb; }
        .page-btn--disabled { color: #d0d5dd; pointer-events: none; }

        /* empty state */
        .empty-state {
            padding: 48px 24px;
            text-align: center;
            color: #667085;
        }

        .empty-state svg {
            width: 48px; height: 48px;
            margin: 0 auto 12px;
            display: block;
            color: #d0d5dd;
        }

        .empty-state p { font-size: 15px; font-weight: 600; color: #344054; margin-bottom: 4px; }
        .empty-state small { font-size: 13px; }

        /* banner */
        .banner--error {
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #fef3f2;
            border: 1px solid #fecdca;
            border-radius: 8px;
            color: #b42318;
            font-size: 14px;
            font-weight: 600;
        }

        /* search tag */
        .search-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        @media (max-width: 700px) {
            .top-bar { flex-direction: column; align-items: stretch; }
            .search-form { max-width: 100%; }
        }
    </style>
</head>
<body>

<header>
    <h1>HR Management</h1>
    <p class="header-note">Team modules</p>
</header>

<div class="page-wrap">

    <!-- Top bar -->
    <div class="top-bar">
        <h1>
            <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                 style="color:#2563eb">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 13.255A23.931 23.931 0 0112 15c-3.183
                         0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2
                         2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2
                         2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            Job Master Table
        </h1>

        <a th:href="@{/}" class="back-link">← Home</a>
    </div>

    <!-- Error banner -->
    <div class="banner--error" th:if="${error != null}" th:text="${error}"></div>

    <!-- Search form -->
    <form class="search-form" method="get" th:action="@{/jobs}" style="margin-bottom:20px;">
        <input type="text" name="search" placeholder="Search by job ID or title…"
               th:value="${search}" autocomplete="off" />
        <button type="submit" class="btn-search">Search</button>
        <a th:if="${search != null and !#strings.isEmpty(search)}"
           th:href="@{/jobs}" class="btn-clear">✕ Clear</a>
    </form>

    <!-- Table card -->
    <div class="table-card">

        <div class="table-card-header">
            <h2>
                Jobs
                <span class="search-tag"
                      th:if="${search != null and !#strings.isEmpty(search)}"
                      th:text="|Searching: ${search}|"></span>
            </h2>
            <!-- FIXED: Using pipes for safe concatenation -->
            <span class="result-count"
                  th:text="|${totalJobs} result${totalJobs != 1 ? 's' : ''} · Page ${currentPage + 1} of ${totalPages}|"></span>
        </div>

        <!-- Table -->
        <div class="table-wrap" th:if="${jobs != null and !jobs.isEmpty()}">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Job ID</th>
                        <th>Job Title</th>
                        <th>Min Salary</th>
                        <th>Max Salary</th>
                        <th>Employees</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="job : ${jobs}"
                        th:data-href="@{/jobs/{id}/employees(id=${job.jobId})}"
                        onclick="window.location=this.dataset.href">
                        <td>
                            <span class="job-id-badge" th:text="${job.jobId}"></span>
                        </td>
                        <td>
                            <strong th:text="${job.jobTitle}"></strong>
                        </td>
                        <td>
                            <!-- FIXED: Better formatting check -->
                            <span class="salary-range"
                                  th:text="${job.minSalary != null} ? |$${#numbers.formatDecimal(job.minSalary, 1, 'COMMA', 0, 'POINT')}| : '—'">
                            </span>
                        </td>
                        <td>
                            <span class="salary-range"
                                  th:text="${job.maxSalary != null} ? |$${#numbers.formatDecimal(job.maxSalary, 1, 'COMMA', 0, 'POINT')}| : '—'">
                            </span>
                        </td>
                        <td>
                            <a class="view-link"
                               th:href="@{/jobs/{id}/employees(id=${job.jobId})}"
                               onclick="event.stopPropagation()">
                                View Employees →
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Empty state -->
        <div class="empty-state" th:if="${jobs == null or jobs.isEmpty()}">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15
                         10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <p>No jobs found</p>
            <!-- FIXED: Safe text for search results -->
            <small th:if="${search != null and !#strings.isEmpty(search)}"
                   th:text="|No results for '${search}'|"></small>
            <small th:unless="${search != null and !#strings.isEmpty(search)}">
                No job records exist yet.
            </small>
        </div>

        <!-- Pagination -->
        <div class="pagination-wrap" th:if="${totalPages > 1}">
            <!-- FIXED: Using pipes for safe concatenation -->
            <span class="page-info"
                  th:text="|${totalJobs} result${totalJobs != 1 ? 's' : ''} · Page ${currentPage + 1} of ${totalPages}|"></span>
            <div class="page-controls">
                <a class="page-btn"
                   th:classappend="${!hasPrevious} ? 'page-btn--disabled'"
                   th:href="@{/jobs(page=${currentPage - 1}, search=${search})}">← Prev</a>

                <th:block th:with="start=${T(java.lang.Math).max(0, currentPage - 2)},
                                   end=${T(java.lang.Math).min(totalPages - 1, currentPage + 2)}">
                    <a th:each="i : ${#numbers.sequence(start, end)}"
                       th:href="@{/jobs(page=${i}, search=${search})}"
                       class="page-btn"
                       th:style="${i == currentPage} ? 'background:#eff6ff;color:#2563eb;border-color:#bfdbfe;' : ''"
                       th:text="${i + 1}"></a>
                </th:block>

                <a class="page-btn"
                   th:classappend="${!hasNext} ? 'page-btn--disabled'"
                   th:href="@{/jobs(page=${currentPage + 1}, search=${search})}">Next →</a>
            </div>
        </div>

    </div><!-- /table-card -->

</div>

<footer>
    <span>HR Management Portal</span>
    <span>Jobs module</span>
</footer>

</body>
</html>
