<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${job != null} ? ${job.jobTitle} + ' – Employees' : 'Job Employees'">Job Employees</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <style>
        body { background: #f6f7fb; font-family: 'Inter', sans-serif; color: #101828; }
        .page-wrap { width: min(1100px, 100%); margin: 0 auto; padding: 32px 24px; }
        
        .breadcrumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #667085; margin-bottom: 24px; }
        .breadcrumb a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .breadcrumb .sep { color: #d0d5dd; }

        .job-hero {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            border-radius: 12px; padding: 28px 32px; color: #fff;
            display: flex; align-items: center; justify-content: space-between;
            gap: 24px; margin-bottom: 28px; box-shadow: 0 4px 16px rgba(37,99,235,.25);
        }

        .job-icon {
            width: 56px; height: 56px; background: rgba(255,255,255,.15);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
        }

        .job-hero h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px 0; }
        .job-id-label { display: inline-flex; padding: 3px 10px; background: rgba(255,255,255,.2); border-radius: 999px; font-size: 12px; font-weight: 700; }

        .table-card { background: #fff; border: 1px solid #eaecf0; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(16,24,40,.1); }
        .table-card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #eaecf0; }
        
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 14px 20px; border-bottom: 1px solid #eaecf0; text-align: left; font-size: 13px; vertical-align: middle; }
        .data-table th { background: #f9fafb; color: #475467; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }

        .contact-info { display: flex; flex-direction: column; gap: 2px; }
        .contact-email { color: #2563eb; font-weight: 500; text-decoration: none; }
        .contact-phone { color: #667085; font-size: 12px; }

        .pagination-footer { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; background: #f9fafb; border-top: 1px solid #eaecf0; }
        .btn-pagination { padding: 8px 14px; border: 1px solid #d0d5dd; border-radius: 8px; text-decoration: none; color: #344054; background: #fff; font-size: 13px; font-weight: 600; transition: background 0.2s; }
        .btn-pagination:hover:not(.btn-pagination--disabled) { background: #f9fafb; }
        .btn-pagination--disabled { color: #d0d5dd; pointer-events: none; background: #fcfcfc; border-color: #f2f4f7; }
        
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #dbeafe; color: #1e40af; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    </style>
</head>
<body>

<div class="page-wrap">
    <!-- Breadcrumbs -->
    <nav class="breadcrumb">
        <a th:href="@{/}">Home</a>
        <span class="sep">›</span>
        <a th:href="@{/jobs}">Jobs</a>
        <span class="sep">›</span>
        <span th:text="${job != null} ? ${job.jobTitle} : 'Employees'"></span>
    </nav>

    <!-- Job Header Summary -->
    <div class="job-hero" th:if="${job != null}">
        <div style="display: flex; align-items: center; gap: 18px;">
            <div class="job-icon">
                <svg width="24" height="24" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
            <div>
                <h1 th:text="${job.jobTitle}">Job Title</h1>
                <span class="job-id-label" th:text="'ID: ' + ${job.jobId}"></span>
            </div>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 28px; font-weight: 800; line-height: 1;" th:text="${employeeCount}">0</div>
            <div style="font-size: 12px; opacity: .8; margin-top: 4px;">Total Employees</div>
        </div>
    </div>

    <!-- Main Table Container -->
    <div class="table-card">
        <div class="table-card-header">
            <h2 style="font-size: 16px; font-weight: 700;">Team Members</h2>
        </div>

        <table class="data-table" th:if="${!employees.isEmpty()}">
            <thead>
                <tr>
                    <th>Employee Name</th>
                    <th>Contact Details</th>
                    <th>Employee ID</th>
                    <th>Joined Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="emp : ${employees}">
                    <td>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <!-- Initials Avatar -->
                            <div class="avatar" th:text="${emp.firstName.substring(0,1)}"></div>
                            <div style="font-weight: 600;" th:text="${emp.firstName} + ' ' + ${emp.lastName}">Full Name</div>
                        </div>
                    </td>
                    <td>
                        <div class="contact-info">
                            <!-- Email -->
                            <span class="contact-email" th:text="${emp.email}">email@example.com</span>
                            <!-- Phone Number -->
                            <span class="contact-phone" th:text="${emp.phoneNumber != null ? emp.phoneNumber : 'No phone listed'}"></span>
                        </div>
                    </td>
                    <td>
                        <code style="background: #f2f4f7; padding: 2px 6px; border-radius: 4px; font-size: 12px;" th:text="${emp.employeeId}">ID</code>
                    </td>
                    <td th:text="${#temporals.format(emp.hireDate, 'MMM dd, yyyy')}">Jan 01, 2024</td>
                </tr>
            </tbody>
        </table>

        <!-- Empty State -->
        <div th:if="${employees.isEmpty()}" style="padding: 60px 20px; text-align: center;">
            <div style="color: #667085; font-size: 14px;">No employees are currently assigned to this role.</div>
        </div>

        <!-- Pagination -->
        <div class="pagination-footer" th:if="${totalPages > 1}">
            <div style="font-size: 13px; color: #475467;">
                Page <span th:text="${currentPage + 1}" style="font-weight: 700;"></span> of <span th:text="${totalPages}" style="font-weight: 700;"></span>
            </div>
            <div style="display: flex; gap: 8px;">
                <a th:href="@{/jobs/{id}/employees(id=${jobId}, page=${currentPage - 1})}"
                   class="btn-pagination" th:classappend="${!hasPrevious} ? 'btn-pagination--disabled'">Previous</a>
                <a th:href="@{/jobs/{id}/employees(id=${jobId}, page=${currentPage + 1})}"
                   class="btn-pagination" th:classappend="${!hasNext} ? 'btn-pagination--disabled'">Next</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
